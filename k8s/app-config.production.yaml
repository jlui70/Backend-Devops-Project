app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:7007

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Configure the catalog index page to be the root page, this is normally mounted on /catalog
    - page:catalog:
        config:
          path: /

organization:
  name: My Company

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

proxy:

techdocs:
  builder: 'local'
  generator:
    runIn: 'docker'
  publisher:
    type: 'local'

auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    guest: {}
    oidc:
      production:
        metadataUrl: ${KEYCLOAK_METADATA_URL}
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        # Default is "none", which never shows a login form (only useful for
        # silent session checks) and immediately fails with login_required
        # when there's no existing Keycloak session. "auto" lets Keycloak
        # decide, so the manual sign-in click actually shows the login page.
        prompt: auto
  clientIdMetadataDocuments:
    enabled: false

scaffolder:

argocd:
  # Number of history entries to fetch per app. The plugin does
  # `history.slice(0, revisionsToLoad)`, so a value of -1 (its default)
  # drops the last entry via JS's negative-index slice semantics instead
  # of meaning "load all" -- with only 1 sync in history this hides
  # everything and the ArgoCD tab renders blank. Use an explicit positive
  # number instead.
  revisionsToLoad: 10
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: default
          url: ${ARGOCD_URL}
          token: ${ARGOCD_AUTH_TOKEN}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  providers:
    keycloakOrg:
      default:
        baseUrl: ${KEYCLOAK_BASE_URL}
        loginRealm: ${KEYCLOAK_REALM}
        realm: ${KEYCLOAK_REALM}
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
    github:
      default:
        organization: ${GITHUB_ORG}
        catalogPath: '/catalog-info.yaml'
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
  locations:
    # Caminhos relativos ao cwd do processo dentro do container (/app), NÃO
    # ao layout do monorepo em dev (que seria ../../examples/...). O
    # Dockerfile copia examples/ para /app/examples nesse mesmo nível.
    - type: file
      target: ./examples/entities.yaml

    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

kubernetes:

permission:
  enabled: true

mcpActions:
  name: 'My Company Backstage'
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal'
