apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: keycloak
type: Opaque
stringData:
  KEYCLOAK_ADMIN_PASSWORD: "keycloak-admin-1234"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: keycloak-storage
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: '/mnt/data/keycloak'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-storage-claim
  namespace: keycloak
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # 🐛6 fix: /opt/keycloak/data (onde o modo start-dev grava o banco H2
      # baseado em arquivo) agora está num PVC, então o realm/client/usuário
      # sobrevivem a restart do pod. O initContainer só ajusta a permissão do
      # hostPath recém-criado (fica root:root 0755 por padrão) pro grupo 0
      # conseguir escrever nele — a imagem do Keycloak roda como uid 1000/gid 0
      # e já espera esse diretório com permissão de grupo (ver drwxrwxr-x atual).
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chmod -R g+rwX /data']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /data
              name: keycloak-data
              subPath: keycloak-data
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0
          args:
            - start-dev
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Split-horizon fix: the Backstage backend pod (in-cluster) and the
            # browser (Windows) reach Keycloak through different network paths.
            # Pods resolve `host.docker.internal` reliably via Docker Desktop's
            # embedded DNS (this is dynamic/live — a hostAliases static-IP copy
            # of it was tried and proved flaky across pod restarts, so don't
            # reintroduce that). The remaining piece is Windows: Docker
            # Desktop's installer already put `host.docker.internal` in the
            # Windows hosts file, but pointing at the machine's real LAN IP,
            # which WSL2 does NOT forward `kubectl port-forward` ports to
            # (only 127.0.0.1 is auto-forwarded). Fix: override that one
            # Windows hosts-file line to `127.0.0.1 host.docker.internal`.
            - name: KC_HOSTNAME_URL
              value: "http://host.docker.internal:8082"
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HOSTNAME_STRICT_BACKCHANNEL
              value: "true"
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /opt/keycloak/data
              name: keycloak-data
              subPath: keycloak-data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: keycloak-storage-claim
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
